          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        },
        "description": "SHA-256 of exact canonical document bytes, excluding the request wrapper. Body limit is 10 MiB plus 4096 wrapper bytes."
