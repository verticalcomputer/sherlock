            },
            "maxItems": 10000
          },
          "next_cursor": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        },
        "description": "Canonical compact Go JSON encoding, exactly as produced by EncodeTypedCollectorResult. Unknown fields, duplicate/noncanonical encodings and trailing bytes are refused. The embedded plan must match the authenticated durable leased plan. Payload facts intentionally preserve GP-02 PascalCase field names. Whole document bytes must not exceed plan.limits.max_bytes; records and nested entities are bounded. Next cursor is only a proposal; it advances after atomic durable commit."
      },
      "TypedResultRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "lease_token",
          "document",
          "sha256"
        ],
        "properties": {
