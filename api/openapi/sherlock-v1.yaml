{
  "openapi": "3.1.0",
  "info": {
    "title": "Sherlock Public API",
    "version": "1.0.0-alpha.1",
    "description": "Cluster-scoped API for Sherlock collection state, evidence, and signed restricted diagnostics. Missing, stale, partial, unavailable, and no-data states are represented explicitly; no arbitrary command or credential value is accepted."
  },
  "servers": [{"url": "/api/v1"}],
  "security": [{"bearerAuth": []}],
  "paths": {
    "/clusters/{cluster_id}/incidents": {
      "get": {
        "operationId": "listIncidents", "summary": "List incidents for an authorized cluster",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"}, {"name": "status", "in": "query", "schema": {"$ref": "#/components/schemas/IncidentStatus"}}, {"name": "severity", "in": "query", "schema": {"$ref": "#/components/schemas/IncidentSeverity"}}],
        "responses": {"200": {"description": "Incident page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IncidentListResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}}
      },
      "post": {
        "operationId": "createIncident", "summary": "Create an incident idempotently",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateIncidentRequest"}}}},
        "responses": {"201": {"description": "Incident created", "headers": {"Location": {"schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Incident"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}}
      }
    },
    "/incidents/{incident_id}": {
      "get": {"operationId": "getIncident", "summary": "Get an incident after resolving its cluster scope", "parameters": [{"$ref": "#/components/parameters/IncidentID"}], "responses": {"200": {"description": "Incident", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Incident"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}
    },
    "/investigations": {
      "post": {
        "operationId": "startInvestigation", "summary": "Start a durable deterministic investigation",
        "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StartInvestigationRequest"}}}},
        "responses": {"202": {"description": "Investigation accepted", "headers": {"Location": {"schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Investigation"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}}
      }
    },
    "/investigations/{investigation_id}": {
      "get": {"operationId": "getInvestigation", "summary": "Get authoritative investigation state and validated finding references", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}], "responses": {"200": {"description": "Investigation", "headers": {"ETag": {"schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Investigation"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}}}
    },
    "/investigations/{investigation_id}/cancel": {
      "post": {"operationId": "cancelInvestigation", "summary": "Cancel a non-terminal investigation with optimistic concurrency", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CancelInvestigationRequest"}}}}, "responses": {"200": {"description": "Cancelled investigation", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Investigation"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}
    },
    "/investigations/{investigation_id}/approvals": {
      "post": {"operationId": "approveInvestigationAction", "summary": "Approve and resume one versioned bounded action", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApproveInvestigationRequest"}}}}, "responses": {"200": {"description": "Resumed investigation", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Investigation"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}
    },
    "/investigations/{investigation_id}/events": {
      "get": {"operationId": "listInvestigationEvents", "summary": "Read durable ordered investigation history", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}, {"name": "Last-Event-ID", "in": "header", "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 1000, "default": 200}}], "responses": {"200": {"description": "Ordered event history", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InvestigationEventListResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}
    },
    "/investigations/{investigation_id}/evidence": {
      "get": {"operationId": "listInvestigationEvidence", "summary": "Read the immutable evidence ledger", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}], "responses": {"200": {"description": "Evidence ledger", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InvestigationEvidenceListResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}
    },
    "/investigations/{investigation_id}/hypotheses": {
      "get": {"operationId": "listInvestigationHypotheses", "summary": "Read supporting and counter-evidence hypotheses", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}], "responses": {"200": {"description": "Hypothesis ledger", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HypothesisListResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}
    },
    "/investigations/{investigation_id}/findings": {
      "get": {"operationId": "listInvestigationFindings", "summary": "Read citation-validated findings", "parameters": [{"$ref": "#/components/parameters/InvestigationID"}], "responses": {"200": {"description": "Finding ledger", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FindingListResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}
    },
    "/clusters": {
      "get": {
        "operationId": "listClusters",
        "summary": "List clusters authorized for the current key",
        "parameters": [{"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"}],
        "responses": {
          "200": {"description": "Authorized clusters", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClusterListResponse"}, "examples": {"success": {"$ref": "#/components/examples/ClusterListSuccess"}}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}, "429": {"$ref": "#/components/responses/RateLimited"}, "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/clusters/{cluster_id}": {
      "get": {
        "operationId": "getCluster",
        "summary": "Get a cluster summary",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}],
        "responses": {
          "200": {"description": "Cluster summary", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Cluster"}, "examples": {"partial": {"$ref": "#/components/examples/ClusterPartial"}}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/clusters/{cluster_id}/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Get the deterministic cluster health projection",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}],
        "responses": {
          "200": {"description": "Health projection, including unavailable and no-data states", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthSummary"}, "examples": {"partial": {"$ref": "#/components/examples/HealthPartial"}}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        }
      }
    },
    "/clusters/{cluster_id}/sources": {
      "get": {
        "operationId": "listSources",
        "summary": "List source state",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"}, {"name": "status", "in": "query", "schema": {"$ref": "#/components/schemas/SourceStatus"}}],
        "responses": {
          "200": {"description": "Source states", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SourceListResponse"}, "examples": {"partial": {"$ref": "#/components/examples/SourceListPartial"}}}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/clusters/{cluster_id}/observations": {
      "get": {
        "operationId": "listObservations",
        "summary": "List normalized observations",
        "parameters": [
          {"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"},
          {"name": "source_id", "in": "query", "schema": {"type": "string"}}, {"name": "entity_key", "in": "query", "schema": {"type": "string"}},
          {"name": "kind", "in": "query", "schema": {"type": "string"}}, {"name": "metric", "in": "query", "schema": {"type": "string"}},
          {"name": "observed_after", "in": "query", "schema": {"$ref": "#/components/schemas/Timestamp"}}, {"name": "observed_before", "in": "query", "schema": {"$ref": "#/components/schemas/Timestamp"}}
        ],
        "responses": {
          "200": {"description": "Normalized observations", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ObservationListResponse"}, "examples": {"success": {"$ref": "#/components/examples/ObservationListSuccess"}}}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/clusters/{cluster_id}/gpus": {
      "get": {
        "operationId": "listGPUSummaries",
        "summary": "List GPU inventory and deterministic health summaries",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"}, {"name": "node_id", "in": "query", "schema": {"type": "string"}}, {"name": "health", "in": "query", "schema": {"$ref": "#/components/schemas/HealthState"}}],
        "responses": {
          "200": {"description": "GPU summaries", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GPUSummaryListResponse"}, "examples": {"incident": {"$ref": "#/components/examples/GPUSummaryIncident"}}}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/clusters/{cluster_id}/collection-runs": {
      "get": {
        "operationId": "listCollectionRuns",
        "summary": "List collection runs",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"}, {"name": "source_id", "in": "query", "schema": {"type": "string"}}, {"name": "status", "in": "query", "schema": {"$ref": "#/components/schemas/CollectionStatus"}}],
        "responses": {
          "200": {"description": "Collection runs", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CollectionRunListResponse"}, "examples": {"partial": {"$ref": "#/components/examples/CollectionRunPartial"}}}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/clusters/{cluster_id}/evidence": {
      "get": {
        "operationId": "listEvidence",
        "summary": "List evidence envelopes",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/PageSize"}, {"$ref": "#/components/parameters/PageToken"}, {"name": "status", "in": "query", "schema": {"$ref": "#/components/schemas/EvidenceStatus"}}, {"name": "target_id", "in": "query", "schema": {"type": "string"}}],
        "responses": {
          "200": {"description": "Evidence envelopes", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EvidenceListResponse"}, "examples": {"partial": {"$ref": "#/components/examples/EvidenceListPartial"}}}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/clusters/{cluster_id}/evidence/{evidence_id}": {
      "get": {
        "operationId": "getEvidence",
        "summary": "Get an evidence envelope and artifact metadata",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/EvidenceID"}],
        "responses": {
          "200": {"description": "Evidence envelope", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Evidence"}, "examples": {"partial": {"$ref": "#/components/examples/EvidencePartial"}}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/clusters/{cluster_id}/diagnostic-runs/preview": {
      "post": {
        "operationId": "previewDiagnosticRun",
        "summary": "Preview authorization for one signed diagnostic action",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticRunRequest"}}}},
        "responses": {"200": {"description": "Authorization decision", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticAuthorizationPreview"}, "examples": {"allowed": {"$ref": "#/components/examples/DiagnosticPreviewAllowed"}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}}
      }
    },
    "/clusters/{cluster_id}/diagnostic-runs": {
      "post": {
        "operationId": "startDiagnosticRun",
        "summary": "Create durable work for one signed diagnostic action",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticRunRequest"}}}},
        "responses": {"202": {"description": "Diagnostic work accepted", "headers": {"Location": {"schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticRun"}, "examples": {"queued": {"$ref": "#/components/examples/DiagnosticRunQueued"}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"description": "Idempotency or state conflict", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}}
      }
    },
    "/clusters/{cluster_id}/diagnostic-runs/{run_id}": {
      "get": {
        "operationId": "getDiagnosticRun",
        "summary": "Get attributable diagnostic attempts and per-target results",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/DiagnosticRunID"}],
        "responses": {"200": {"description": "Diagnostic run without raw output or credential material", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticRun"}, "examples": {"queued": {"$ref": "#/components/examples/DiagnosticRunQueued"}}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}}
      }
    },
    "/clusters/{cluster_id}/diagnostic-runs/{run_id}/approval": {
      "post": {
        "operationId": "approveDiagnosticRun",
        "summary": "Approve one versioned privileged diagnostic action",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"$ref": "#/components/parameters/DiagnosticRunID"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticApprovalRequest"}}}},
        "responses": {"200": {"description": "Approved run", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DiagnosticRun"}, "examples": {"queued": {"$ref": "#/components/examples/DiagnosticRunQueued"}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"description": "Stale or conflicting approval", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}}}
      }
    },
    "/clusters/{cluster_id}/events": {
      "get": {
        "operationId": "streamEvents",
        "summary": "Stream durable collection and source updates",
        "description": "Events have monotonic IDs within a cluster stream. Reconnect with Last-Event-ID; the REST resources remain authoritative.",
        "parameters": [{"$ref": "#/components/parameters/ClusterID"}, {"name": "Last-Event-ID", "in": "header", "schema": {"type": "string"}}, {"name": "event_type", "in": "query", "schema": {"type": "array", "items": {"$ref": "#/components/schemas/EventType"}}, "style": "form", "explode": true}],
        "responses": {
          "200": {"description": "SSE stream. Each framed data field is a JSON CollectionRunEvent or SourceEvent.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-cache"}}, "X-Accel-Buffering": {"schema": {"type": "string", "const": "no"}}}, "content": {"text/event-stream": {"schema": {"oneOf": [{"$ref": "#/components/schemas/CollectionRunEvent"}, {"$ref": "#/components/schemas/SourceEvent"}]}, "example": {"schema_version": 1, "cluster_id": "cluster_h100_prod", "occurred_at": "2026-08-19T12:00:04Z", "run_id": "run_01JABC", "status": "PARTIAL"}, "x-sse-framing-example": "id: evt_000042\nevent: collection_run.updated\ndata: {\"schema_version\":1,\"cluster_id\":\"cluster_h100_prod\",\"occurred_at\":\"2026-08-19T12:00:04Z\",\"run_id\":\"run_01JABC\",\"status\":\"PARTIAL\"}\n\n"}}},
          "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "410": {"description": "Requested event is outside the replay window", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}}, "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {"bearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "Sherlock cluster API key"}},
    "parameters": {
      "ClusterID": {"name": "cluster_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "EvidenceID": {"name": "evidence_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "DiagnosticRunID": {"name": "run_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "IncidentID": {"name": "incident_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "InvestigationID": {"name": "investigation_id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "PageSize": {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}},
      "PageToken": {"name": "page_token", "in": "query", "schema": {"type": "string", "maxLength": 2048}}
    },
    "responses": {
      "BadRequest": {"description": "Invalid request", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}, "examples": {"invalid": {"$ref": "#/components/examples/InvalidRequest"}}}}},
      "Unauthorized": {"description": "Missing or invalid API key", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}, "examples": {"unauthorized": {"$ref": "#/components/examples/Unauthorized"}}}}},
      "Forbidden": {"description": "Key lacks capability or belongs to a different cluster", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}, "examples": {"forbidden": {"$ref": "#/components/examples/Forbidden"}}}}},
      "NotFound": {"description": "Resource not found in the authorized cluster", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}, "examples": {"not_found": {"$ref": "#/components/examples/NotFound"}}}}},
      "Conflict": {"description": "Idempotency, version, or state conflict", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "RateLimited": {"description": "Rate limit exceeded", "headers": {"Retry-After": {"schema": {"type": "integer", "minimum": 1}}}, "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "InternalError": {"description": "Internal error", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "ServiceUnavailable": {"description": "Service temporarily unavailable", "headers": {"Retry-After": {"schema": {"type": "integer", "minimum": 1}}}, "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}, "examples": {"unavailable": {"$ref": "#/components/examples/Unavailable"}}}}}
    },
    "schemas": {
      "Timestamp": {"type": "string", "format": "date-time", "examples": ["2026-08-19T12:00:00Z"]},
      "IncidentSeverity": {"type": "string", "enum": ["INFO", "LOW", "MEDIUM", "HIGH", "CRITICAL"]},
      "IncidentStatus": {"type": "string", "enum": ["OPEN", "INVESTIGATING", "MONITORING", "RESOLVED", "CLOSED"]},
