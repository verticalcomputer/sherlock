Match User sherlock-runner
    AuthorizedKeysFile /etc/ssh/authorized_keys/sherlock-runner
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    MaxSessions 1
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    ForceCommand /usr/local/libexec/sherlock-runner-force-command

Match all
