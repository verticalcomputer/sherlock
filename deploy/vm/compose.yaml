name: sherlock

services:
  postgres:
    image: ${SHERLOCK_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHERLOCK_POSTGRES_DB:-sherlock}
      POSTGRES_USER: ${SHERLOCK_POSTGRES_USER:-sherlock}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    ports:
      - "${SHERLOCK_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${SHERLOCK_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: ${SHERLOCK_POSTGRES_SHM_SIZE:-256mb}
    stop_grace_period: 1m
    volumes:
      - sherlock-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  postgres_password:
    file: ${SHERLOCK_POSTGRES_PASSWORD_FILE:-/etc/sherlock/secrets/postgres_password}

volumes:
  sherlock-postgres:
