name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Check documentation index and local links
        run: make check-docs
      - name: Check offline cooling profiles
        run: python3 -B -m unittest discover -s scripts -p test_cooling_profiles.py
      - name: Check release signing policy without credentials
        run: python3 -m unittest discover -s scripts -p test_release_signing.py
      - name: Check collector signing policy without credentials
        run: python3 -B -m unittest discover -s scripts -p test_collector_release.py
      - name: Check public export boundaries with synthetic data
        run: python3 -m unittest discover -s scripts -p test_export_public_candidate.py
      - name: Check unsigned release assembly with synthetic data
        run: python3 -m unittest discover -s scripts -p test_prepare_release_review.py
      - name: Check hosted unsigned preparation policy
        run: python3 -m unittest discover -s scripts -p test_prepare_hosted_release.py
      - name: Check reproducible candidate builder with synthetic data
        run: python3 -m unittest discover -s scripts -p test_build_telemetry_candidate.py
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: staticcheck ./...
      - run: ./scripts/check-sdk-sync.sh
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --prefix sdk/typescript
      - run: npm --prefix sdk/typescript run smoke

  integration-tests:
    name: integration-${{ matrix.lane }}
    runs-on: blacksmith-4vcpu-ubuntu-2604
    strategy:
      fail-fast: false
      matrix:
        lane: [postgres-0, postgres-1, postgres-2, other]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sherlock
          POSTGRES_PASSWORD: sherlock
          POSTGRES_DB: sherlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sherlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHERLOCK_DATABASE_URL: postgres://sherlock:sherlock@localhost:5432/sherlock?sslmode=disable
      SHERLOCK_TEST_DATABASE_URL: postgres://sherlock:sherlock@localhost:5432/sherlock?sslmode=disable
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
      - run: go mod download
      - run: go run ./cmd/sherlock-migrate -dir migrations
      - name: Check integration shard coverage
        run: python3 -m unittest discover -s scripts -p test_integration_shard.py
      - name: Run integration shard
        shell: bash
        run: python3 scripts/run-integration-shard.py "${{ matrix.lane }}" 2>&1 | tee "${{ runner.temp }}/integration-${{ matrix.lane }}.log"
      # Race instrumentation changes latency. Qualify production assessment budgets
      # in a normal build, alongside race lifecycle tests.
      - name: Qualify production assessment budgets
        if: matrix.lane == 'postgres-0'
        shell: bash
        run: |
          go test -tags=integration ./internal/store/postgres -list '^TestProductionAssessmentAgedBacklogBudget$' | grep -Fx 'TestProductionAssessmentAgedBacklogBudget'
          go test -tags=integration ./internal/store/postgres -list '^TestProductionAssessmentFleetAgedBacklogBudget$' | grep -Fx 'TestProductionAssessmentFleetAgedBacklogBudget'
          go test -tags=integration ./internal/store/postgres -list '^TestProductionAssessmentFleetDeepHistoryBudget$' | grep -Fx 'TestProductionAssessmentFleetDeepHistoryBudget'
          go test -tags=integration ./internal/store/postgres -list '^TestProductionOrderedOpenAndRecoveryInOneBatch$' | grep -Fx 'TestProductionOrderedOpenAndRecoveryInOneBatch'
          go test -count=1 -tags=integration ./internal/store/postgres -run '^TestProduction(Assessment(AgedBacklogBudget|FleetAgedBacklogBudget|FleetDeepHistoryBudget)|OrderedOpenAndRecoveryInOneBatch)$' -v
      - name: Preserve integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.lane }}
          path: ${{ runner.temp }}/integration-${{ matrix.lane }}.log
          if-no-files-found: warn
      - name: Run scenario test bed with fresh worker processes
        if: matrix.lane == 'other'
        run: make testbed TESTBED_OUTPUT="${{ runner.temp }}/sherlock-testbed.json"
      - name: Preserve scenario test-bed report
        if: always() && matrix.lane == 'other'
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-testbed
          path: ${{ runner.temp }}/sherlock-testbed.json
          if-no-files-found: warn

  # Preserve the existing required status. A failed, canceled or skipped lane
  # must not turn into a successful aggregate check.
  integration:
    if: always()
    needs: integration-tests
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - name: Require every integration lane
        env:
          RESULT: ${{ needs.integration-tests.result }}
        run: test "$RESULT" = success
