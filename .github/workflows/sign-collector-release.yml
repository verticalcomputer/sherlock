name: Sign reviewed collector and intake candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-release-signing
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'verticalcomputer/sherlock' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the existing protected collector environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify-collector-release.py environment

  sign:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: collector-release-signing
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      COLLECTOR_RELEASE_APPROVAL_JSON: ${{ vars.COLLECTOR_RELEASE_APPROVAL_JSON }}
    steps:
      - name: Check out the exact approved workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate approval, source tag and artifact origin
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/verify-collector-release.py select
          printf 'RELEASE_DIRECTORY=%s/collector-signing\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download the exact approved collector artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_id }}
          run-id: ${{ steps.selection.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RELEASE_DIRECTORY }}
          merge-multiple: true
      - name: Validate package before installing signing tools
        run: python3 -B scripts/verify-collector-release.py prepare --directory "$RELEASE_DIRECTORY"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.2
      - name: Sign and verify only the approved collector manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify-collector-release.py sign --directory "$RELEASE_DIRECTORY"
      - name: Retain the verified package and signature bundles for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sherlock-signed-collector-intake-linux-amd64
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.RELEASE_DIRECTORY }}/SHA256SUMS
            ${{ env.RELEASE_DIRECTORY }}/SHA256SUMS.sigstore.json
            ${{ env.RELEASE_DIRECTORY }}/provenance.unsigned.json
            ${{ env.RELEASE_DIRECTORY }}/provenance.unsigned.json.sigstore.json
            ${{ env.RELEASE_DIRECTORY }}/source-files.json
            ${{ env.RELEASE_DIRECTORY }}/source.tar.gz
            ${{ env.RELEASE_DIRECTORY }}/sbom.spdx.json
            ${{ env.RELEASE_DIRECTORY }}/sherlock-collector-linux-amd64
            ${{ env.RELEASE_DIRECTORY }}/sherlock-control-linux-amd64
